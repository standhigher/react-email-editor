name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有版本标签，例如 v0.4.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout version tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          NODE
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      # 已完成完整检查与构建，发布时跳过重复的本地生命周期脚本。
      - name: Publish with OIDC and provenance
        run: npm publish --ignore-scripts --provenance --access public
