<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">Project module architecture</title><desc id="description">8 connected modules: choose content → edit → preview → save or export. Content block library, Drag-and-drop canvas, Block &amp; body settings, Subject &amp; personalization, Desktop / mobile preview, Custom blocks &amp; resources, Document &amp; editing state, Email rendering &amp; validation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#91a2b8" stroke-width="1.6"/></marker></defs><g font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1440" height="1300" rx="0" fill="#ffffff" stroke="#ffffff"/>
<text x="48" y="59" font-size="38" font-weight="700" fill="#152033">Project module architecture</text>
<text x="48" y="101" font-size="23" font-weight="400" fill="#64748b">8 connected modules: choose content → edit → preview → save or export</text>
<rect x="48" y="135" width="1344" height="88" rx="16" fill="#eff4fb" stroke="#d8e1ed"/>
<text x="72" y="173" font-size="26" font-weight="650" fill="#152033">Embed in your application</text>
<text x="72" y="205" font-size="22" font-weight="400" fill="#475569">Add email editing to your website, admin app or business system</text>
<path d="M720 223 V250" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="262" width="1344" height="514" rx="20" fill="#f8fafc" stroke="#ccd7e5"/>
<text x="72" y="305" font-size="27" font-weight="700" fill="#152033">Modules people interact with</text>
<text x="560" y="304" font-size="21" font-weight="400" fill="#64748b">Six core capabilities for creating an email</text>
<rect x="72" y="332" width="416" height="188" rx="16" fill="#ffffff" stroke="#d8e1ed"/>
<rect x="90" y="350" width="38" height="34" rx="9" fill="#efeaff" stroke="#efeaff"/>
<text x="97" y="375" font-size="18" font-weight="700" fill="#6653c1">01</text>
<text x="142" y="376" font-size="23" font-weight="650" fill="#152033">Content block library</text>
<text x="92" y="420" font-size="20" font-weight="400" fill="#475569">Heading, text, button and image</text>
<text x="92" y="453" font-size="20" font-weight="400" fill="#475569">Divider, spacer and custom HTML</text>
<text x="92" y="486" font-size="20" font-weight="400" fill="#475569">Drag the content into your email</text>
<rect x="512" y="332" width="416" height="188" rx="16" fill="#ffffff" stroke="#d8e1ed"/>
<rect x="530" y="350" width="38" height="34" rx="9" fill="#e7f1ff" stroke="#e7f1ff"/>
<text x="537" y="375" font-size="18" font-weight="700" fill="#266ab5">02</text>
<text x="582" y="376" font-size="23" font-weight="650" fill="#152033">Drag-and-drop canvas</text>
<text x="532" y="420" font-size="20" font-weight="400" fill="#475569">Reorder, duplicate and delete blocks</text>
<text x="532" y="453" font-size="20" font-weight="400" fill="#475569">Edit text and rich text directly</text>
<text x="532" y="486" font-size="20" font-weight="400" fill="#475569">See the layout while you edit</text>
<rect x="952" y="332" width="416" height="188" rx="16" fill="#ffffff" stroke="#d8e1ed"/>
<rect x="970" y="350" width="38" height="34" rx="9" fill="#fff1e1" stroke="#fff1e1"/>
<text x="977" y="375" font-size="18" font-weight="700" fill="#a3652d">03</text>
<text x="1022" y="376" font-size="23" font-weight="650" fill="#152033">Block &amp; body settings</text>
<text x="972" y="420" font-size="20" font-weight="400" fill="#475569">Change content, colors and borders</text>
<text x="972" y="453" font-size="20" font-weight="400" fill="#475569">Adjust width, padding and spacing</text>
<text x="972" y="486" font-size="20" font-weight="400" fill="#475569">Set email-wide fonts and background</text>
<rect x="72" y="545" width="416" height="188" rx="16" fill="#ffffff" stroke="#d8e1ed"/>
<rect x="90" y="563" width="38" height="34" rx="9" fill="#e7f6ef" stroke="#e7f6ef"/>
<text x="97" y="588" font-size="18" font-weight="700" fill="#268163">04</text>
<text x="142" y="589" font-size="23" font-weight="650" fill="#152033">Subject &amp; personalization</text>
<text x="92" y="633" font-size="20" font-weight="400" fill="#475569">Set the email subject</text>
<text x="92" y="666" font-size="20" font-weight="400" fill="#475569">Insert customer or store variables</text>
<text x="92" y="699" font-size="20" font-weight="400" fill="#475569">See replacements with sample data</text>
<rect x="512" y="545" width="416" height="188" rx="16" fill="#ffffff" stroke="#d8e1ed"/>
<rect x="530" y="563" width="38" height="34" rx="9" fill="#e7f1ff" stroke="#e7f1ff"/>
<text x="537" y="588" font-size="18" font-weight="700" fill="#266ab5">05</text>
<text x="582" y="589" font-size="23" font-weight="650" fill="#152033">Desktop / mobile preview</text>
<text x="532" y="633" font-size="20" font-weight="400" fill="#475569">Switch between desktop and mobile</text>
<text x="532" y="666" font-size="20" font-weight="400" fill="#475569">Preview resolved template variables</text>
<text x="532" y="699" font-size="20" font-weight="400" fill="#475569">Review content and layout before sending</text>
<rect x="952" y="545" width="416" height="188" rx="16" fill="#ffffff" stroke="#d8e1ed"/>
<rect x="970" y="563" width="38" height="34" rx="9" fill="#efeaff" stroke="#efeaff"/>
<text x="977" y="588" font-size="18" font-weight="700" fill="#6653c1">06</text>
<text x="1022" y="589" font-size="23" font-weight="650" fill="#152033">Custom blocks &amp; resources</text>
<text x="972" y="633" font-size="20" font-weight="400" fill="#475569">Add business blocks, e.g. product cards</text>
<text x="972" y="666" font-size="20" font-weight="400" fill="#475569">Customize editing UI and controls</text>
<text x="972" y="699" font-size="20" font-weight="400" fill="#475569">Connect your image resource picker</text>
<path d="M494 426 H504" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M944 426 H934" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M720 776 V812" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" />
<text x="48" y="826" font-size="24" font-weight="650" fill="#475569">Shared capabilities supporting all editing modules</text>
<path d="M720 845 V856 H386 V876" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M720 856 H1054 V876" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="889" width="642" height="153" rx="16" fill="#f3efff" stroke="#dcd1f5"/>
<rect x="70" y="909" width="38" height="34" rx="9" fill="#e7defb" stroke="#e7defb"/>
<text x="77" y="934" font-size="18" font-weight="700" fill="#6653c1">07</text>
<text x="122" y="936" font-size="26" font-weight="650" fill="#40347a">Document &amp; editing state</text>
<text x="72" y="976" font-size="21" font-weight="400" fill="#475569">Keep content, block order, styles and subject together</text>
<text x="72" y="1010" font-size="21" font-weight="400" fill="#475569">Load, replace and reset; editor instances stay isolated</text>
<rect x="750" y="889" width="642" height="153" rx="16" fill="#eef5ff" stroke="#cddff7"/>
<rect x="772" y="909" width="38" height="34" rx="9" fill="#dfeaff" stroke="#dfeaff"/>
<text x="779" y="934" font-size="18" font-weight="700" fill="#266ab5">08</text>
<text x="824" y="936" font-size="26" font-weight="650" fill="#225897">Email rendering &amp; validation</text>
<text x="774" y="976" font-size="21" font-weight="400" fill="#475569">Validate controls and blocks; generate email HTML</text>
<text x="774" y="1010" font-size="21" font-weight="400" fill="#475569">Keep templates for delivery or resolve data for preview</text>
<path d="M690 965 H738" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M369 1042 V1081" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1071 1042 V1081" fill="none" stroke="#91a2b8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="1094" width="642" height="137" rx="16" fill="#edf8f1" stroke="#cce4d5"/>
<text x="72" y="1134" font-size="27" font-weight="700" fill="#286844">JSON document</text>
<text x="72" y="1170" font-size="23" font-weight="400" fill="#475569">Your app saves the draft</text>
<text x="72" y="1202" font-size="23" font-weight="400" fill="#475569">Load it later and continue editing</text>
<rect x="750" y="1094" width="642" height="137" rx="16" fill="#edf5ff" stroke="#cddff7"/>
<text x="774" y="1134" font-size="27" font-weight="700" fill="#225897">Email HTML</text>
<text x="774" y="1170" font-size="23" font-weight="400" fill="#475569">Export templates or preview output</text>
<text x="774" y="1202" font-size="23" font-weight="400" fill="#475569">Pass it to your email delivery system</text>
<text x="48" y="1272" font-size="21" font-weight="400" fill="#64748b">This project builds, previews and exports emails. Your app handles storage, uploads and delivery.</text>
</g></svg>